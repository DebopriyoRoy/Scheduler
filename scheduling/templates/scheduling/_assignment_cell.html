{% if assignment %}<div class="assignment-card p-2 rounded bg-white {% if assignment.manually_overridden %}assignment-override{% elif assignment.assignment_type == 'ON_CALL' %}assignment-on-call{% else %}assignment-confirmed{% endif %}"><strong>{{ assignment.employee.display_name }}</strong><br><span class="small">{% if assignment.manually_overridden %}MANUAL OVERRIDE{% else %}{{ assignment.get_assignment_type_display|upper }}{% endif %}</span><br><a class="small" href="{% url 'schedule_override' assignment.pk %}">Replace</a><details class="mt-1"><summary class="small">Why?</summary><small>{{ assignment.selection_reason }}</small></details></div>{% else %}<div class="assignment-card assignment-shortage p-2 rounded bg-white"><strong>SHORTAGE</strong><br><span class="small">No assignment</span></div>{% endif %}
