{% extends "scheduling/base.html" %}
{% block title %}Square Integration | Spirit Scheduling Engine{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3"><h1 class="h2 mb-0">Square Connection</h1><a href="{% url 'dashboard' %}">Dashboard</a></div>
<div class="card border-0 shadow-sm"><div class="card-body"><p class="text-uppercase text-secondary small fw-semibold mb-2">Environment</p><p class="h4">Sandbox</p><p class="mb-0"><span class="status-dot {% if connection_status == 'Connected to Sandbox' %}status-connected{% endif %}"></span>{{ connection_status }}</p></div></div>
{% endblock %}
