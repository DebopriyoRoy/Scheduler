{% extends "scheduling/base.html" %}
{% block title %}{% if show %}Edit{% else %}Add{% endif %} Show | Spirit Scheduling Engine{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-8">
  <div class="d-flex justify-content-between align-items-center mb-3"><h1 class="h2">{% if show %}Edit Show{% else %}Add Show{% endif %}</h1><a href="{% url 'show_list' %}">Back to shows</a></div>
  <div class="card border-0 shadow-sm"><div class="card-body p-4"><form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary" type="submit">Save Show</button></form></div></div>
</div></div>
{% endblock %}
