{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Spirit Scheduling Engine{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{% static 'scheduling/css/app.css' %}" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark spirit-nav shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="{% url 'dashboard' %}">Spirit Scheduling Engine</a>
      {% if user.is_authenticated %}
        <div class="d-flex align-items-center gap-3 text-white">
          <span class="small">{{ user.get_username }}</span>
          <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button class="btn btn-sm btn-outline-light" type="submit">Sign out</button>
          </form>
        </div>
      {% endif %}
    </div>
  </nav>

  <main class="container py-4">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
