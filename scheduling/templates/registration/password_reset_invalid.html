{% extends "registration/auth_base.html" %}
{% block title %}Link expired | Spirit Scheduling Agent{% endblock %}
{% block form_card %}
  <h1>That link no longer works</h1>
  <p class="text-secondary small mb-4">
    Reset links can be used once, and stop working as soon as the password changes.
  </p>
  <a class="btn btn-primary w-100" href="{% url 'password_reset' %}">Send a new link</a>
  <div class="auth-links"><a href="{% url 'login' %}">Back to sign in</a></div>
{% endblock %}
