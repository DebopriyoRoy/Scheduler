{% extends "scheduling/base.html" %}
{% block title %}Sign in | Spirit Scheduling Engine{% endblock %}
{% block content %}
<div class="row justify-content-center py-5"><div class="col-md-6 col-lg-4"><div class="card border-0 shadow-sm"><div class="card-body p-4"><h1 class="h3 mb-3">Management sign in</h1>{% if form.errors %}<div class="alert alert-danger">Your username or password was not accepted.</div>{% endif %}<form method="post">{% csrf_token %}<div class="mb-3"><label class="form-label" for="id_username">Username</label><input class="form-control" type="text" name="username" id="id_username" autocomplete="username" required autofocus></div><div class="mb-3"><label class="form-label" for="id_password">Password</label><input class="form-control" type="password" name="password" id="id_password" autocomplete="current-password" required></div><button class="btn btn-primary w-100" type="submit">Sign in</button></form></div></div></div></div>
{% endblock %}
